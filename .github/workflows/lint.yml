name: Lint

# Runs `./gradlew check` and uploads the Checkstyle reports; checks the hub token budget.
# Non-blocking for now since the project is not conformant.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Gradle Check (Java 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
        shell: bash

      - name: Upload Checkstyle HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-html
          path: build/reports/checkstyle
          if-no-files-found: warn

      - name: Upload Checkstyle XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-xml
          path: build/reports/checkstyle/*.xml
          if-no-files-found: warn

  tokens:
    # The plugin hub's review bot refuses more than 200,000 tokens of comment-stripped
    # src/main/java. This budget sits below that and comes down as the source shrinks, so growth
    # shows up on the commit that causes it instead of at release time.
    name: Hub token budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count tokens
        run: |
          pip install tiktoken
          python scripts/hub_tokens.py --max 190000
        shell: bash
