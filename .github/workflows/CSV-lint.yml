name: CSV Lint

# Runs the TSV consistency checker (scripts/check_tsv.py) against the PR's own code. It is the
# only linter: the GPS TSV format has comment headers, blank separator lines and omitted trailing
# cells, all of which an RFC 4180 checker (the csvlint binary this workflow once ran, inherited
# from the upstream CSV data) rejects on 22 of the 40 files by construction.
# Uses `pull_request` (not `pull_request_target`) so the PR branch version of
# scripts and workflow YAML is used — changes to check_tsv.py or this workflow
# can be tested in PRs.  Comment posting is handled by the separate
# csv-lint-comment.yml workflow_run workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  csv-lint:
    name: CSV Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: TSV Consistency Check
        id: tsv-check
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/check_tsv.py ./src/main/resources 2>&1 | tee tsv-output.txt
          exit ${PIPESTATUS[0]}

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p artifact
          cp tsv-output.txt artifact/
          echo "${{ steps.tsv-check.outcome }}" > artifact/outcome.txt
          echo "${{ github.event.number }}" > artifact/pr-number.txt

      - name: Upload lint results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tsv-lint-results
          path: artifact/

      - name: Fail if TSV check failed
        if: steps.tsv-check.outcome == 'failure'
        run: exit 1
